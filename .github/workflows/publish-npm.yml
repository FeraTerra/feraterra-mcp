name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish feraterra-mcp via npm OIDC Trusted Publisher
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm@11.2.0 for OIDC Trusted Publishing
        run: npm install -g npm@11.2.0

      - name: Verify package.json version matches release git tag
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PKG_VER="$(node -p "JSON.parse(require('node:fs').readFileSync('./package.json', 'utf8')).version")"
          if [ "${EVENT_NAME}" = "release" ] || [[ "${REF_NAME}" == v* ]]; then
            EXPECTED_TAG="v${PKG_VER}"
            if [ "${REF_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Release tag '${REF_NAME}' does not match package.json version '${EXPECTED_TAG}'"
              exit 1
            fi
          fi
          echo "Verified package version v${PKG_VER}"

      - name: Run self-test and unit tests before publishing
        run: |
          node ./bin/feraterra-mcp.mjs --self-test
          node --test test/mcp.test.mjs

      - name: Check npm registry bootstrap readiness
        id: npm_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://registry.npmjs.org/feraterra-mcp)
          echo "http_status=${STATUS}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${STATUS}" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::feraterra-mcp is not yet initialized on registry.npmjs.org (HTTP ${STATUS}). Bootstrap the package and bind Trusted Publisher (FeraTerra/feraterra-mcp, publish-npm.yml) on npmjs.com, then trigger workflow_dispatch or publish the next release."
          fi

      - name: Publish to npm with provenance
        if: steps.npm_check.outputs.ready == 'true'
        run: npm publish --access public --provenance
